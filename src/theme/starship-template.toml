# Basalt starship config — full config with the active palette injected.
# Generated by matugen; user-role colors map to Material roles:
#   primary  → cyan role (+ directory/branch/git_status)
#   secondary→ the bright prompt element
#   tertiary → hostname
#   error    → error symbol
add_newline = true
command_timeout = 200
format = "$hostname$directory$git_branch$git_status$character"

[character]
error_symbol = "[✗](bold {{colors.error.default.hex}})"
success_symbol = "[❯](bold {{colors.primary.default.hex}})"

[directory]
repo_root_format = "[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) "
repo_root_style = "bold {{colors.primary.default.hex}}"
truncation_length = 2
truncation_symbol = "…/"

[git_branch]
format = "[$branch]($style) "
style = "italic {{colors.primary.default.hex}}"

[git_status]
ahead = "⇡${count} "
behind = "⇣${count} "
conflicted = " "
deleted = ""
diverged = "⇕⇡${ahead_count}⇣${behind_count} "
format = "[$all_status]($style)"
modified = " "
renamed = ""
staged = ""
stashed = ""
style = "{{colors.primary.default.hex}}"
untracked = "? "
up_to_date = " "

[hostname]
format = "[$hostname ❯ ]($style)"
ssh_only = false
style = "bold {{colors.tertiary.default.hex}}"