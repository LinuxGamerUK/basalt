# Basalt starship config — the Catppuccin Powerline preset structure
# (starship.rs/presets/catppuccin-powerline) with every color mapped to
# the live Material palette. Generated by matugen; do not edit.
#
# Role mapping:
#   red      → primary (accent)          peach     → tertiary
#   yellow   → secondary                 green     → secondary_container
#   sapphire → primary_container         lavender  → tertiary_container
#   crust    → the matching on_* role
"$schema" = 'https://starship.rs/config-schema.json'

format = """
[](fg:{{colors.primary.default.hex}})\
$os\
$username\
[](bg:{{colors.tertiary.default.hex}} fg:{{colors.primary.default.hex}})\
$directory\
[](bg:{{colors.secondary.default.hex}} fg:{{colors.tertiary.default.hex}})\
$git_branch\
$git_status\
[](fg:{{colors.secondary.default.hex}} bg:{{colors.secondary_container.default.hex}})\
$c\
$rust\
$golang\
$nodejs\
$bun\
$php\
$java\
$kotlin\
$haskell\
$python\
[](fg:{{colors.secondary_container.default.hex}} bg:{{colors.primary_container.default.hex}})\
$conda\
[](fg:{{colors.primary_container.default.hex}} bg:{{colors.tertiary_container.default.hex}})\
$time\
[ ](fg:{{colors.tertiary_container.default.hex}})\
$cmd_duration\
$line_break\
$character"""

palette = "basalt"

[palettes.basalt]
primary = "{{colors.primary.default.hex}}"
on_primary = "{{colors.on_primary.default.hex}}"
tertiary = "{{colors.tertiary.default.hex}}"
on_tertiary = "{{colors.on_tertiary.default.hex}}"
secondary = "{{colors.secondary.default.hex}}"
on_secondary = "{{colors.on_secondary.default.hex}}"
secondary_container = "{{colors.secondary_container.default.hex}}"
on_secondary_container = "{{colors.on_secondary_container.default.hex}}"
primary_container = "{{colors.primary_container.default.hex}}"
on_primary_container = "{{colors.on_primary_container.default.hex}}"
tertiary_container = "{{colors.tertiary_container.default.hex}}"
on_tertiary_container = "{{colors.on_tertiary_container.default.hex}}"
error = "{{colors.error.default.hex}}"

[os]
disabled = false
style = "bg:{{colors.primary.default.hex}} fg:{{colors.on_primary.default.hex}}"

[os.symbols]
NixOS = "󰌽"
Linux = "󰌽"
Windows = ""
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
Arch = "󰣇"
Debian = "󰣚"

[username]
show_always = true
style_user = "bg:{{colors.primary.default.hex}} fg:{{colors.on_primary.default.hex}}"
style_root = "bg:{{colors.primary.default.hex}} fg:{{colors.on_primary.default.hex}}"
format = '[ $user]($style)'

[directory]
style = "bg:{{colors.tertiary.default.hex}} fg:{{colors.on_tertiary.default.hex}}"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

[git_branch]
symbol = ""
style = "bg:{{colors.secondary.default.hex}}"
format = '[[ $symbol $branch ](fg:{{colors.on_secondary.default.hex}} bg:{{colors.secondary.default.hex}})]($style)'

[git_status]
style = "bg:{{colors.secondary.default.hex}}"
format = '[[($all_status$ahead_behind )](fg:{{colors.on_secondary.default.hex}} bg:{{colors.secondary.default.hex}})]($style)'

[nodejs]
symbol = ""
style = "bg:{{colors.secondary_container.default.hex}}"
format = '[[ $symbol( $version) ](fg:{{colors.on_secondary_container.default.hex}} bg:{{colors.secondary_container.default.hex}})]($style)'

[bun]
symbol = ""
style = "bg:{{colors.secondary_container.default.hex}}"
format = '[[ $symbol( $version) ](fg:{{colors.on_secondary_container.default.hex}} bg:{{colors.secondary_container.default.hex}})]($style)'

[c]
symbol = " "
style = "bg:{{colors.secondary_container.default.hex}}"
format = '[[ $symbol( $version) ](fg:{{colors.on_secondary_container.default.hex}} bg:{{colors.secondary_container.default.hex}})]($style)'

[rust]
symbol = ""
style = "bg:{{colors.secondary_container.default.hex}}"
format = '[[ $symbol( $version) ](fg:{{colors.on_secondary_container.default.hex}} bg:{{colors.secondary_container.default.hex}})]($style)'

[golang]
symbol = ""
style = "bg:{{colors.secondary_container.default.hex}}"
format = '[[ $symbol( $version) ](fg:{{colors.on_secondary_container.default.hex}} bg:{{colors.secondary_container.default.hex}})]($style)'

[python]
symbol = ""
style = "bg:{{colors.secondary_container.default.hex}}"
format = '[[ $symbol( $version)(\(#$virtualenv\)) ](fg:{{colors.on_secondary_container.default.hex}} bg:{{colors.secondary_container.default.hex}})]($style)'

[conda]
symbol = " "
style = "fg:{{colors.on_primary_container.default.hex}} bg:{{colors.primary_container.default.hex}}"
format = '[$symbol$environment ]($style)'
ignore_base = false

[time]
disabled = false
time_format = "%R"
style = "bg:{{colors.tertiary_container.default.hex}}"
format = '[[  $time ](fg:{{colors.on_tertiary_container.default.hex}} bg:{{colors.tertiary_container.default.hex}})]($style)'

[line_break]
disabled = true

[character]
disabled = false
success_symbol = '[❯](bold fg:{{colors.secondary_container.default.hex}})'
error_symbol = '[❯](bold fg:{{colors.error.default.hex}})'

[cmd_duration]
show_milliseconds = false
format = " in $duration "
style = "bg:{{colors.tertiary_container.default.hex}}"
disabled = false