# Basalt starship config — Powerline-style pill segments with the
# active palette injected. Generated by matugen; do not edit.
# House roles: user@host = tertiary container pill, path = surface pill,
# git = secondary container pill, ❯ = primary.
add_newline = true
command_timeout = 200
palette = "basalt"

[palettes.basalt]
primary = "{{colors.primary.default.hex}}"
error = "{{colors.error.default.hex}}"
surface = "{{colors.surface.default.hex}}"
surface_container_high = "{{colors.surface_container_high.default.hex}}"
on_surface = "{{colors.on_surface.default.hex}}"
tertiary_container = "{{colors.tertiary_container.default.hex}}"
on_tertiary_container = "{{colors.on_tertiary_container.default.hex}}"
secondary_container = "{{colors.secondary_container.default.hex}}"
on_secondary_container = "{{colors.on_secondary_container.default.hex}}"

format = "$hostname$directory$git_branch$git_status$character"

[hostname]
format = "[ ](fg:tertiary_container)[ $hostname ❯ ](bg:tertiary_container fg:on_tertiary_container)[ ](fg:tertiary_container) "
style = "bg:tertiary_container"

[character]
error_symbol = "[❯](bold {{colors.error.default.hex}})"
success_symbol = "[❯](bold {{colors.primary.default.hex}})"

[directory]
repo_root_format = "[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) "
repo_root_style = "bg:surface_container_high fg:primary bold"
format = "[ ](fg:surface_container_high)[$path]($style)[ ](fg:surface_container_high) "
truncation_length = 2
truncation_symbol = "…/"
style = "bg:surface_container_high fg:on_surface"

[git_branch]
format = "[ ](fg:secondary_container)[$branch]($style)[ ](fg:secondary_container) "
style = "bg:secondary_container fg:on_secondary_container"

[git_status]
format = "[$all_status]($style)"
style = "bg:secondary_container fg:on_secondary_container"
ahead = "⇡${count} "
behind = "⇣${count} "
conflicted = " "
deleted = ""
diverged = "⇕⇡${ahead_count}⇣${behind_count} "
modified = " "
renamed = ""
staged = ""
stashed = ""
untracked = "? "
up_to_date = " "