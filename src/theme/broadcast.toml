# Basalt theme broadcast — matugen config.
# Input: a wallpaper or source color (same as the main matugen.toml).
# Output: per-app theme files under ~/.config/basalt/themes/ — MUTABLE
# paths (HM-declared configs live in the nix store and cannot be written).
#
# Run via: matugen image|color <source> -c <this file>
# Templates resolve relative to this config file; output_path ~ expands.
# NOTE: TOML inline tables must stay single-line.

[config]
# Charter: no update checks. Ever.
version_check = false
fallback_color = "#4fd8e0"

[templates]
# ghostty theme file — referenced by ghostty's `theme = ...` key.
ghostty = { format = "file", input_path = "./ghostty-template", output_path = "~/.config/basalt/themes/ghostty" }

# fish palette — sourced before every prompt (fish_prompt event handler).
fish = { format = "file", input_path = "./fish-template", output_path = "~/.config/basalt/themes/palette.fish" }

# starship full config with the active palette — STARSHIP_CONFIG points here.
starship = { format = "file", input_path = "./starship-template.toml", output_path = "~/.config/basalt/themes/starship.toml" }

# fastfetch palette include — HM fastfetch config includes this.
fastfetch = { format = "json", input_path = "./fastfetch-template.jsonc", output_path = "~/.config/basalt/themes/fastfetch-palette.jsonc" }